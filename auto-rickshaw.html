<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Rickshaw 2024 — procedural Three.js</title>
<style>
  :root { color-scheme: light; --ink:#1b1f22; --paper:#eef0ef; --accent:#f0a712; --olive:#5c6132; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#dfe3e4; font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); overflow:hidden; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  .panel { position:fixed; background:rgba(250,251,250,.86); backdrop-filter:blur(8px); border:1px solid rgba(0,0,0,.08); border-radius:12px; box-shadow:0 6px 24px rgba(20,30,30,.12); }
  #head { top:14px; left:14px; padding:12px 14px; max-width:300px; }
  #head h1 { margin:0 0 2px; font-size:15px; letter-spacing:.2px; }
  #head p { margin:0; color:#556; font-size:12px; }
  #head .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip { font-size:11px; padding:2px 8px; border-radius:99px; background:#e4e8e6; color:#333; }
  #ctl { right:14px; top:14px; padding:10px; display:flex; flex-direction:column; gap:6px; width:150px; }
  #views { left:50%; transform:translateX(-50%); bottom:14px; padding:6px; display:flex; gap:4px; }
  button { font:inherit; border:1px solid rgba(0,0,0,.12); background:#fff; color:var(--ink); border-radius:8px; padding:7px 10px; cursor:pointer; transition:.12s; text-align:left; }
  button:hover { border-color:#999; }
  button.on { background:var(--olive); color:#fff; border-color:var(--olive); }
  #views button { text-align:center; padding:6px 12px; }
  #views button.on { background:var(--accent); color:#1b1500; border-color:var(--accent); }
  #label { position:fixed; left:14px; bottom:14px; padding:6px 10px; min-width:120px; border-radius:8px; background:rgba(20,24,26,.82); color:#fff; font-size:12px; pointer-events:none; }
  #label:empty { opacity:0; }
  #note { position:fixed; right:14px; bottom:14px; font-size:11px; color:#5a6468; max-width:230px; text-align:right; }
  @media (max-width:640px){ #head{max-width:60vw} #ctl{top:auto;bottom:66px;flex-direction:row;flex-wrap:wrap;width:auto;left:14px;right:14px} #note,#label{display:none} }
</style>
</head>
<body>
<div id="app"></div>
<div class="panel" id="head">
  <h1>Auto Rickshaw 2024</h1>
  <p>Code-only Three.js rebuild of the technical blueprint — orbit, zoom, hover parts.</p>
  <div class="chips"><span class="chip">L 2.63 m</span><span class="chip">W 1.26 m</span><span class="chip">H 1.70 m</span><span class="chip">WB 1.97 m</span></div>
</div>
<div class="panel" id="ctl">
  <button id="b-drive">Drive</button>
  <button id="b-lights">Headlights</button>
  <button id="b-wipers">Wiper</button>
  <button id="b-hazards">Hazards</button>
  <button id="b-cut">Cutaway · engine</button>
  <button id="b-glb">Download GLB</button>
</div>
<div class="panel" id="views">
  <button data-view="iso" class="on">3/4</button><button data-view="side">Side</button><button data-view="front">Front</button><button data-view="rear">Rear</button><button data-view="top">Top</button>
</div>
<div id="label"></div>
<div id="note">Reference-led reconstruction from one blueprint. Hidden surfaces and interior are inferred.</div>
