<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rickshaw Rush 3D — Play</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ac5dc;font-family:system-ui,Arial;color:#fff}#game{position:absolute;inset:0}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.pill{background:#101b18e8;border:1px solid #ffffff30;border-radius:12px;padding:9px 12px;font-weight:750;box-shadow:0 5px 18px #0002}#status{font-size:12px;font-weight:500;max-width:100%}#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;gap:10px}button{border:1px solid #ffffff55;border-radius:16px;background:#122019e8;color:white;font-weight:850;padding:16px;min-width:62px;min-height:58px;touch-action:none;box-shadow:0 6px 20px #0003}button:active,button.on{background:#e9b52b;color:#16140c}#steer{display:flex;gap:8px}#pedals{display:flex;gap:8px}#startPanel{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#0b161777,#0b1617a8);padding:20px}#card{max-width:430px;background:#111d18f2;border:1px solid #ffffff30;border-radius:22px;padding:24px;box-shadow:0 15px 70px #0005}h1{margin:0 0 8px;font-size:clamp(28px,7vw,42px)}p{line-height:1.5;color:#d3dfd5}#start{width:100%;background:#f5c332;color:#172016;border:0;margin-top:8px}#maplink{color:#ffe18a;font-size:13px}
</style></head><body><div id="game"></div>
<div id="hud"><div class="pill">🛺 <span id="speed">0</span> km/h</div><div class="pill">Distance <span id="distance">0</span> m</div><div class="pill" id="status">Preparing road route…</div></div>
<div id="controls"><div id="steer"><button id="left">◀</button><button id="right">▶</button></div><div id="pedals"><button id="brake">BRAKE</button><button id="go">GO ▲</button></div></div>
<div id="startPanel"><div id="card"><h1>Rickshaw Rush 3D</h1><p>Drive a 3D auto-rickshaw along real road geometry around Powai, Mumbai. Uses OpenStreetMap road data and a real driving route when the routing service is available.</p><p id="maplink">Loading route data… you can start while it loads.</p><button id="start">START DRIVING</button></div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
const mount=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc4d7);scene.fog=new THREE.Fog(0x9bc4d7,90,360);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x596b4b,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-50,90,40);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshStandardMaterial({color:0x87ad78}));ground.rotation.x=-Math.PI/2;ground.position.y=-.15;ground.receiveShadow=true;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({color:0x454a4d,roughness:1});const lineMat=new THREE.MeshStandardMaterial({color:0xf3c54a});const roadsGroup=new THREE.Group();scene.add(roadsGroup);
function roadStrip(points,width=6,material=roadMat,y=0){if(points.length<2)return;const verts=[],idx=[];for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1],dx=b.x-a.x,dz=b.z-a.z,l=Math.hypot(dx,dz)||1,nx=-dz/l*width/2,nz=dx/l*width/2,k=verts.length/3;verts.push(a.x+nx,y,a.z+nz,a.x-nx,y,a.z-nz,b.x+nx,y,b.z+nz,b.x-nx,y,b.z-nz);idx.push(k,k+1,k+2,k+1,k+3,k+2)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(idx);g.computeVertexNormals();roadsGroup.add(new THREE.Mesh(g,material))}
function box(parent,w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function makeCar(){const g=new THREE.Group(),green=new THREE.MeshStandardMaterial({color:0x118344,metalness:.12,roughness:.45}),yellow=new THREE.MeshStandardMaterial({color:0xffc52d,metalness:.05}),black=new THREE.MeshStandardMaterial({color:0x202322,roughness:.8}),glass=new THREE.MeshStandardMaterial({color:0x9ed9e7,transparent:true,opacity:.78,metalness:.15}),chrome=new THREE.MeshStandardMaterial({color:0xc2cbca,metalness:.8});box(g,1.5,.35,2.2,green,0,.75,0);box(g,1.4,.16,.7,yellow,0,.95,.75);box(g,1.25,.78,1.08,green,0,1.25,-.28);box(g,1.02,.48,.06,glass,0,1.34,.28);box(g,1.42,.14,1.35,yellow,0,1.68,-.28);box(g,.8,.15,.55,black,0,1.0,-.55);box(g,.09,.15,.1,yellow,0,.85,1.12);for(const x of [-.78,.78])for(const z of [-.7,.75]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.18,18),black);w.rotation.z=Math.PI/2;w.position.set(x,.36,z);w.castShadow=true;g.add(w);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.19,16),chrome);hub.rotation.z=Math.PI/2;hub.position.copy(w.position);g.add(hub)}const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.1,24),new THREE.MeshBasicMaterial({color:0x18251a,transparent:true,opacity:.22}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.02;g.add(shadow);scene.add(g);return g}
const car=makeCar();let route=[],routeIdx=0,routeReady=false,started=false,throttle=false,braking=false,steer=0,speed=0,distance=0,heading=0,lateral=0,last=performance.now();let worldPoints=[];
const center=[72.9052,19.1197];
function xy(lon,lat){return {x:(lon-center[0])*111320*Math.cos(center[1]*Math.PI/180)*.12,z:-(lat-center[1])*111320*.12}}
function drawRoute(coords){worldPoints=coords.map(([lon,lat])=>xy(lon,lat));route=worldPoints;routeIdx=0;for(let i=0;i<route.length-1;i++){roadStrip([route[i],route[i+1]],5.5,roadMat,0);roadStrip([route[i],route[i+1]],.16,lineMat,.035)}if(route.length){car.position.set(route[0].x,0,route[0].z);if(route.length>1)heading=Math.atan2(route[1].x-route[0].x,route[1].z-route[0].z);document.querySelector('#status').textContent='Real OSRM route loaded';document.querySelector('#maplink').textContent='Road route ready. Press START DRIVING.'}}
async function loadRoute(){try{const coords='72.9052,19.1197;72.9105,19.1240';const u='https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson';const r=await fetch(u);if(!r.ok)throw Error('OSRM HTTP '+r.status);const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw Error('No route returned');drawRoute(j.routes[0].geometry.coordinates)}catch(e){document.querySelector('#status').textContent='Route service unavailable';document.querySelector('#maplink').textContent='Could not fetch a live route right now. You can still drive in practice mode.';const fallback=[];for(let i=0;i<160;i++){const z=i*.8;fallback.push({x:Math.sin(i*.035)*10,z:-z})}route=fallback;routeIdx=0;for(let i=0;i<route.length-1;i++)roadStrip([route[i],route[i+1]],6,roadMat,0);car.position.set(route[0].x,0,route[0].z)}}
function trees(){const trunk=new THREE.MeshStandardMaterial({color:0x76543a}),leaf=new THREE.MeshStandardMaterial({color:0x3b7c40});for(let i=0;i<90;i++){const x=(Math.random()-.5)*180,z=-Math.random()*300;if(Math.abs(x)<9)continue;const t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,2.4,6),trunk);t.position.set(x,1.2,z);scene.add(t);const l=new THREE.Mesh(new THREE.ConeGeometry(1.3,3.4,7),leaf);l.position.set(x,3.8,z);scene.add(l)}}
trees();
function hold(id,on,off){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');on()});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{b.classList.remove('on');off()})}
hold('go',()=>throttle=true,()=>throttle=false);hold('brake',()=>braking=true,()=>braking=false);hold('left',()=>steer=-1,()=>{if(steer===-1)steer=0});hold('right',()=>steer=1,()=>{if(steer===1)steer=0});
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('start').onclick=()=>{started=true;document.getElementById('startPanel').style.display='none'};
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(started){const go=throttle||keys.w||keys.arrowup,brake=braking||keys.s||keys.arrowdown||keys[' '],turn=steer||(keys.a||keys.arrowleft?-1:0)||(keys.d||keys.arrowright?1:0);speed=brake?Math.max(0,speed-35*dt):go?Math.min(48,speed+18*dt):Math.max(0,speed-6*dt);heading+=turn*dt*(.6+speed*.025);if(route.length>1&&speed>0){const target=route[Math.min(routeIdx+1,route.length-1)],dx=target.x-car.position.x,dz=target.z-car.position.z;if(Math.hypot(dx,dz)<1.2&&routeIdx<route.length-2)routeIdx++;const steerOffset=turn*dt*speed*.035;lateral+=steerOffset;const desired=Math.atan2(dx,dz);let diff=(desired-heading+Math.PI*3)%(Math.PI*2)-Math.PI;heading+=diff*Math.min(1,dt*1.5);const step=speed/3.6*.12*dt;car.position.x+=Math.sin(heading)*step;car.position.z+=Math.cos(heading)*step;distance+=step/.12}car.rotation.y=heading;document.querySelector('#speed').textContent=Math.round(speed);document.querySelector('#distance').textContent=Math.round(distance)}camera.position.lerp(new THREE.Vector3(car.position.x-Math.sin(heading)*11,7.2,car.position.z-Math.cos(heading)*11),.08);camera.lookAt(car.position.x,1,car.position.z+Math.cos(heading)*3);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loadRoute();animate(performance.now());
</script></body></html>
